# Build the static site and deploy dist/client/ to GoDaddy cPanel over SSH (rsync).
#
# Runs on every push to main, and by hand from the Actions tab
# ("Run workflow"), where "dry_run" lists what would change without touching
# the server. Nothing is uploaded unless the build and the output checks pass.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         148.66.138.156
#   SSH_USER         the cPanel username
#   SSH_PORT         22
#   SSH_PRIVATE_KEY  the private deploy key (the file without .pub)
#
# IMPORTANT: neofertility.co.in is the account's main domain, so its document
# root is public_html/ itself. That folder also holds the other two live sites
# (dermasolutions.co.in/, neofollicletransplant.com/,
# darmatest.dermasolutions.co.in/), the old-site backups (neofertility.co.in-old/,
# *-old-hapimed/) and unrelated files (Google Search Console verification html,
# BlogVault connector, .well-known SSL files, cgi-bin, .user.ini, error_log,
# client.zip, .htaccess.bk, ...). None of those may be changed or deleted.
#
# So this deploy writes ONLY these 8 items in public_html/ (the ALLOWED list):
#   .htaccess index.html llms.txt robots.txt sitemap.xml favicon.png assets/ pages/
#   - they are passed to rsync by name, so public_html/ itself (and its
#     permissions) is never synced, and nothing else at the top level is
#     ever looked at;
#   - stale files are only deleted inside assets/ and pages/;
#   - as a second safety net, every top-level item is protected from deletion
#     (--filter='P /*');
#   - the build is refused if its top level holds anything not on the list.
# A top-level file this site stops shipping is therefore left on the server;
# remove it by hand if that ever matters.

name: Deploy to GoDaddy

on:
  push:
    # Only main uploads. A push to ci/auto-deploy runs the whole thing as a
    # dry run, to test the pipeline without touching the live site.
    branches: [main, ci/auto-deploy]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the changes only, upload nothing
        type: boolean
        default: false

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/pvxu8uik8hqc/public_html/
  SITE_URL: https://neofertility.co.in
  # The only top-level items this deploy may write (see the note above).
  ALLOWED: .htaccess index.html llms.txt robots.txt sitemap.xml favicon.png assets pages
  # Upload for real only from main, and only when "dry run" was not ticked.
  DRY_RUN: ${{ (inputs.dry_run || github.ref != 'refs/heads/main') && '--dry-run' || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prerenders every route to HTML, then moves the route folders under
      # dist/client/pages/ (public/.htaccess maps /<route>/ back to them).
      - name: Build
        run: npm run build:static

      # Guard against a broken build wiping or polluting the live site.
      - name: Check build output
        working-directory: dist/client
        run: |
          # Every ALLOWED item must exist, or rsync would upload a partial set.
          for item in $ALLOWED; do
            [ -e "$item" ] || { echo "missing from build: $item"; exit 1; }
          done
          pages=$(find . -name index.html | wc -l)
          echo "prerendered pages: $pages"
          [ "$pages" -ge 40 ]
          # Only these may sit at the top level, since that is public_html/
          # itself. Anything else could collide with another site's folder.
          bad=0
          for entry in $(ls -A); do
            case " $ALLOWED " in
              *" $entry "*) ;;
              *) echo "unexpected top-level entry: $entry"; bad=1 ;;
            esac
          done
          exit $bad

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # -c compares by checksum, so only files whose content changed are sent
      # (every build rewrites timestamps). --chmod gives the web server the
      # usual 755/644, applied only to the items sent (assets/ and pages/ were
      # left world-writable by the old manual upload).
      #
      # The ALLOWED items are passed by name instead of syncing "dist/client/",
      # so rsync never syncs public_html/ itself: --delete only applies inside
      # assets/ and pages/, and the top level is never scanned for deletion.
      # --filter='P /*' is a second guard on top of that.
      - name: Deploy
        working-directory: dist/client
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -n "$DRY_RUN" ]; then echo "DRY RUN: listing changes only, nothing is uploaded or deleted"; fi
          # --delay-updates swaps every new file in together at the end, and
          # --delete-after removes old ones only after that, so a visitor never
          # gets a page pointing at a file that is already gone.
          # $ALLOWED is unquoted on purpose: it is a list of names.
          rsync -rlptzc --delete --delete-after --delay-updates --itemize-changes $DRY_RUN \
            --chmod=D755,F644 \
            --filter='P /*' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes" \
            $ALLOWED "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      # The root .htaccess is read by Apache for the other sites too, so check
      # they still load after every deploy, not just this one. The Google
      # verification file is a server-only file this deploy must not affect.
      - name: Smoke test
        if: ${{ env.DRY_RUN == '' }}
        run: |
          fail=0
          for url in \
            "$SITE_URL/" \
            "$SITE_URL/contact/" \
            "$SITE_URL/blogs/" \
            "$SITE_URL/ivf-treatment-in-bangalore/" \
            "$SITE_URL/sitemap.xml" \
            "$SITE_URL/robots.txt" \
            "$SITE_URL/google1ec01d4567990eed.html" \
            "https://neofollicletransplant.com/" \
            "https://dermasolutions.co.in/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
