                  - heading "Constant Support And Care" [level=3] [ref=f64e696]
                - paragraph [ref=f64e697]: Words can't express how thankful I am to Payal ma'am. Throughout my journey to become pregnant, she stood by me with constant support and care. My husband and I struggled for a long time, and our dream came true only because of Dr. Payal. I have deep trust in her. Whenever I felt scared or unsure, I would remind myself that Payal ma'am is an excellent doctor—and just that thought would bring me peace. She is truly dedicated, always listening patiently and answering every doubt with compassion. She personally did all my scans, even coming to the clinic on holidays when needed. There were times when scans were required daily, and she was always there without fail. Her treatment is always accurate, and her deep knowledge gave me so much confidence. I'm truly grateful to be going through this journey with her. The clinic is always very hygienic, and everyone there always treated us with respect and care. I would definitely recommend Dr. Payal to anyone struggling with infertility and looking for a specialist.
