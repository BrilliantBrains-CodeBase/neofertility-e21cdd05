      - region "Fertility treatments" [ref=f64e189]:
        - generic [ref=f64e191]:
          - 'group "1 of 8: Intrauterine Insemination (IUI) Treatment" [ref=f64e192]':
            - generic [ref=f64e193]:
              - generic [ref=f64e194]:
                - generic [ref=f64e195]: Assisted Conception
                - heading "Intrauterine Insemination (IUI) Treatment" [level=3] [ref=f64e205]
                - paragraph [ref=f64e206]: IUI is a simple, minimally invasive fertility treatment in which prepared, healthy sperm is placed directly into the uterus during ovulation. It is often the recommended first step for couples with unexplained infertility, mild male factor issues, or ovulation problems.
              - generic [ref=f64e207]:
                - img "Intrauterine Insemination (IUI) Treatment" [ref=f64e208]
                - link "Explore IUI treatment in Marathahalli" [ref=f64e209] [cursor=pointer]:
                  - /url: /intrauterine-insemination-iui-treatment-marathahalli-whitefield-in-bangalore/
                  - text: Read More
          - 'group "2 of 8: In Vitro Fertilization (IVF) Treatment" [ref=f64e213]':
            - generic [ref=f64e214]:
              - generic [ref=f64e215]:
                - generic [ref=f64e216]: Assisted Conception
                - heading "In Vitro Fertilization (IVF) Treatment" [level=3] [ref=f64e221]
                - paragraph [ref=f64e222]: IVF is one of the most effective fertility treatments available today. Eggs are fertilised with sperm in our advanced laboratory, and the healthiest embryo is transferred to the uterus. IVF is recommended for blocked fallopian tubes, low ovarian reserve, failed IUI cycles, and unexplained infertility.
              - generic [ref=f64e223]:
                - img "In Vitro Fertilization (IVF) Treatment" [ref=f64e224]
                - link "Explore IVF treatment in Marathahalli" [ref=f64e225] [cursor=pointer]:
                  - /url: /best-ivf-treatment-in-marathahalli-whitefield-bangalore/
                  - text: Read More
          - 'group "3 of 8: Intracytoplasmic Sperm Injection (ICSI)" [ref=f64e229]':
            - generic [ref=f64e230]:
              - generic [ref=f64e231]:
                - generic [ref=f64e232]: Assisted Conception
                - heading "Intracytoplasmic Sperm Injection (ICSI)" [level=3] [ref=f64e239]
                - paragraph [ref=f64e240]: ICSI is an advanced form of IVF in which a single healthy sperm is injected directly into the egg to achieve fertilisation. It is the most effective option for severe male factor infertility, including low sperm count and poor sperm motility.
              - generic [ref=f64e241]:
                - img "Intracytoplasmic Sperm Injection (ICSI)" [ref=f64e242]
                - link "Explore ICSI treatment" [ref=f64e243] [cursor=pointer]:
                  - /url: /icsi-treatment-in-marathahalli-whitefield-bangalore/
                  - text: Read More
          - 'group "4 of 8: Egg Freezing and Fertility Preservation" [ref=f64e247]':
            - generic [ref=f64e248]:
              - generic [ref=f64e249]:
                - generic [ref=f64e250]: Fertility Preservation
                - heading "Egg Freezing and Fertility Preservation" [level=3] [ref=f64e266]
                - paragraph [ref=f64e267]: Egg freezing allows women to preserve their fertility by storing healthy eggs for future use. It is ideal for women who want to delay pregnancy for career, health, or personal reasons, and before medical treatments that may affect fertility.
              - generic [ref=f64e268]:
                - img "Egg Freezing and Fertility Preservation" [ref=f64e269]
                - link "Explore egg freezing in Bangalore" [ref=f64e270] [cursor=pointer]:
                  - /url: /best-egg-freezing-clinic-in-marathahalli-bangalore/
                  - text: Read More
          - 'group "5 of 8: Male Infertility Treatment" [ref=f64e274]':
            - generic [ref=f64e275]:
              - generic [ref=f64e276]:
                - generic [ref=f64e277]: Male Fertility
                - heading "Male Infertility Treatment" [level=3] [ref=f64e285]
                - paragraph [ref=f64e286]: Male factors contribute to nearly half of all infertility cases. Our male fertility solutions include advanced semen analysis, hormonal evaluation, sperm retrieval techniques, and targeted treatment for low sperm count, motility, and morphology issues.
              - generic [ref=f64e287]:
                - img "Male Infertility Treatment" [ref=f64e288]
                - link "Explore male infertility treatment" [ref=f64e289] [cursor=pointer]:
